[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "work-box"
version = "0.1.0"
description = "A small, filesystem-first project box for installed AI workers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
work-box = "workbox.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workbox"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
