[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "work-box"
version = "0.1.0"
description = "A finished, read-only CLI for shared WorkOrder state"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
work-box-orders = "workbox.list_work_orders:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workbox"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
